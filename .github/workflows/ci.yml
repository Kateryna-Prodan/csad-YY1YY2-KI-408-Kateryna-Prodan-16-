name: Cross-platform build

on:
  push:
    branches:
      - 'develop'
      - 'master'
  pull_request:
    branches:
      - 'develop'
      - 'master'

jobs:
  cross_build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & test on Windows
        if: runner.os == 'Windows'
        run: cmd /c ci.bat

      - name: Build & test on Linux/macOS
        if: runner.os != 'Windows'
        run: bash ci.sh
